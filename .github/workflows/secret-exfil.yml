name: attacker-secret-access-test
on:
  push:
    branches: [attacker-poison-branch]
jobs:
  access-restricted-env:
    runs-on: ubuntu-latest
    environment:
      name: restricted-env
    steps:
      - run: |
          echo "secret length is: ${#MYSECRET}"
        env:
          MYSECRET: ${{ secrets.MAIN_ONLY_SECRET }}
